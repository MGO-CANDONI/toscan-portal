# Netlify deploy settings for the TOSCAN Portal.
# No build step: Netlify serves the "public" folder exactly as it is.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always fetch the newest page, scripts and styles after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/app.css"
  [headers.values]
    Cache-Control = "no-cache"

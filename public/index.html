<style>
:root{
  --black:#0b0b0c; --black-2:#17171a; --line-dark:#2a2a2d;
  --gold:#c9a227; --gold-light:#e6c968; --gold-dim:#8a701c;
  --bg:#f4f2ec; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2ded3;
  --ok:#2f7a3d; --ok-bg:#e5f3e7; --warn:#9a6a00; --warn-bg:#fdf3d9;
  --bad:#a83232; --bad-bg:#fbe7e7; --info:#2a5d9f; --info-bg:#e6eefa;
  --radius:10px; font-size:15px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .5em;letter-spacing:.2px}
h2{font-size:1.35rem} h3{font-size:1.05rem}
a{color:var(--info)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:.85rem} .right{text-align:right} .nowrap{white-space:nowrap}

/* buttons & fields */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:.55rem .95rem;border-radius:8px;font-weight:600;display:inline-flex;gap:.45rem;align-items:center;justify-content:center}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--black);color:var(--gold-light);border-color:var(--black)}
.btn.primary:hover{background:#222}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--info);padding:0;text-decoration:underline;font-weight:500}
label{display:block;font-size:.82rem;font-weight:600;color:#444;margin-bottom:.25rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=tel],select,textarea{
  width:100%;padding:.55rem .65rem;border:1px solid #cfcabd;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold)}
input:disabled,select:disabled,textarea:disabled{background:#f1efe9;color:#666}
.grid{display:grid;gap:.85rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}
.req::after{content:" *";color:var(--bad)}

/* cards, tables, badges */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-bottom:1rem}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.card-head h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:.8rem 1rem}
.stat .n{font-size:1.6rem;font-weight:700;font-family:Georgia,serif}
.stat .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:2px solid var(--line);padding:.5rem}
td{border-bottom:1px solid var(--line);padding:.55rem .5rem;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#faf8f2}
.empty{padding:1.2rem;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;background:#eee;color:#444}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.b-gold{background:#f7edc8;color:#6d5512}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.toolbar > div{min-width:140px}
.notice{padding:.7rem .9rem;border-radius:8px;margin-bottom:.9rem;font-size:.9rem}
.notice.info{background:var(--info-bg);color:#1f4777}
.notice.warn{background:var(--warn-bg);color:#6b4a00}
.notice.bad{background:var(--bad-bg);color:#7a2020}
.notice.ok{background:var(--ok-bg);color:#1f5a2a}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:.5rem}
.progress > div{height:100%;width:0;background:var(--gold);transition:width .2s}

/* avatar */
.avatar{border-radius:50%;object-fit:cover;background:var(--black);color:var(--gold-light);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}

/* login */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at top,#26221a,#0b0b0c 70%)}
.auth-card{background:#fff;border-radius:14px;width:100%;max-width:420px;padding:1.8rem 1.6rem;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth-card.wide{max-width:760px}
.auth-brand{text-align:center;margin-bottom:1.2rem}
.auth-brand img{width:84px;height:84px}
.auth-brand h1{font-size:1.6rem;margin:.4rem 0 .1rem}
.auth-brand p{margin:0;color:var(--muted);font-size:.9rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.7rem;border:1px solid #cfcabd;border-radius:8px;background:#fff;font-weight:600}
.gbtn:hover{background:#faf8f2}
.or{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.8rem;margin:1rem 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-links{display:flex;justify-content:space-between;margin-top:.9rem;font-size:.88rem;gap:.5rem;flex-wrap:wrap}
.msg{font-size:.88rem;margin-top:.7rem}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

/* shell */
.topbar{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;border-bottom:2px solid var(--gold-dim)}
.topbar img.seal{width:36px;height:36px}
.topbar .brand{font-family:Georgia,serif;color:var(--gold-light);font-size:1.1rem;line-height:1.1}
.topbar .brand small{display:block;color:#aaa;font-family:"Segoe UI",sans-serif;font-size:.7rem}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:.55rem;font-size:.85rem}
.who .role{color:var(--gold-light);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.topbar .btn{background:transparent;color:#eee;border-color:#444}
.layout{display:flex;min-height:calc(100vh - 54px)}
.side{width:230px;background:var(--black-2);padding:1rem .6rem;flex:none}
.side button{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:#ddd;text-align:left;padding:.6rem .8rem;border-radius:8px;margin-bottom:2px;font-weight:500}
.side button:hover{background:#232327}
.side button.active{background:var(--gold);color:#1a1405;font-weight:700}
.side .count{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:.05rem .45rem}
.main{flex:1;min-width:0;padding:1.3rem;max-width:1200px}
@media(max-width:860px){
  .layout{flex-direction:column}
  .side{width:auto;display:flex;overflow-x:auto;padding:.4rem;gap:.3rem}
  .side button{width:auto;white-space:nowrap;margin:0}
  .main{padding:1rem}
  .who .name{display:none}
}
.refresh-bar{position:sticky;top:56px;z-index:10;background:var(--info-bg);color:#1f4777;padding:.5rem .8rem;border-radius:8px;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}

/* profile header */
.profile-head{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.profile-head .info h2{margin:0 0 .25rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}

/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:820px;padding:1.3rem 1.3rem 1rem;position:relative}
.modal .x{position:absolute;right:.7rem;top:.5rem;background:none;border:0;font-size:1.6rem;color:#888}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
#toast div{background:#222;color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.9rem;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:var(--bad)} #toast div.ok{background:var(--ok)}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--gold-light);background:var(--black);font-family:Georgia,serif;font-size:1.1rem}

/* print */
#print-area{display:none}
@media print{
  body{background:#fff}
  body > *:not(#print-area){display:none!important}
  #print-area{display:block!important;color:#000;font-family:Georgia,serif}
  @page{size:A4 portrait;margin:12mm}
}
.ph{text-align:center;margin-bottom:10px}
.ph img{width:70px;height:70px}
.ph .l1{font-weight:700;font-size:15px}
.ph .l2{font-size:12px}
.ph .l3{font-weight:700;font-size:17px;margin-top:6px;letter-spacing:1px}
.ph .l4{font-size:13px;margin-top:2px}
.pt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.pt th,.pt td{border:1px solid #000;padding:4px 6px;color:#000}
.pt th{text-transform:none;letter-spacing:0;font-size:11px;background:#eee}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:26px;font-size:11.5px}
.sig .nm{margin-top:28px;border-top:1px solid #000;text-align:center;font-weight:700;padding-top:2px;min-height:18px}
.sig .ttl{text-align:center;font-size:10.5px}
</style>

function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function guessSchoolYear() { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 5 ? `${y}-${y+1}` : `${y-1}-${y}`; }
function toDate(ts) { if (!ts) return null; if (ts.toDate) return ts.toDate(); const d = new Date(ts); return isNaN(d) ? null : d; }
function fmtDate(ts, withTime = false) {
  const d = toDate(ts); if (!d) return "—";
  return d.toLocaleDateString("en-PH", { year: "numeric", month: "short", day: "numeric", ...(withTime ? { hour: "numeric", minute: "2-digit" } : {}) });
}
function money(n) { const v = Number(n) || 0; return "₱" + v.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function plainMoney(n) { return (Number(n) || 0).toFixed(2); }
function fullName(u) {
  if (!u) return "";
  const n = [u.surname ? u.surname + "," : "", u.firstName, u.middleName, u.extName].filter(Boolean).join(" ").trim();
  return n || u.displayName || u.email || "(no name)";
}
function initials(u) { const a = (u?.firstName || u?.displayName || u?.email || "?")[0] || "?"; const b = (u?.surname || "")[0] || ""; return (a + b).toUpperCase(); }
function avatar(u, size = 40) {
  if (u?.photoURL) return `<img class="avatar" src="${esc(u.photoURL)}" alt="" style="width:${size}px;height:${size}px">`;
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px">${esc(initials(u))}</span>`;
}
function fileBadge(s) { const c = { Submitted: "b-info", "Under Review": "b-warn", Approved: "b-ok", Returned: "b-bad" }[s] || ""; return `<span class="badge ${c}">${esc(s || "—")}</span>`; }
function userBadge(s) { const c = { pending: "b-warn", approved: "b-ok", declined: "b-bad", archived: "" }[s] || ""; return `<span class="badge ${c}">${esc(USER_STATUSES[s] || s || "—")}</span>`; }
function payBadge(s) { return s === "Released" ? `<span class="badge b-ok">Released</span>` : s ? `<span class="badge b-warn">${esc(s)}</span>` : `<span class="badge">Not set</span>`; }
function groupBadge(g) { return g && g !== "none" ? `<span class="badge b-gold">${esc(GROUPS[g] || g)}</span>` : ""; }
function toast(msg, kind = "") {
  const d = document.createElement("div"); d.textContent = msg; if (kind) d.className = kind;
  $("#toast").appendChild(d); setTimeout(() => d.remove(), kind === "err" ? 7000 : 3800);
}
function opt(value, label, selected) { return `<option value="${esc(value)}" ${String(value) === String(selected ?? "") ? "selected" : ""}>${esc(label)}</option>`; }
function opts(list, selected, blankLabel) {
  return (blankLabel !== undefined ? opt("", blankLabel, selected) : "") +
    list.map(x => Array.isArray(x) ? opt(x[0], x[1], selected) : opt(x, x, selected)).join("");
}
function batchList() { const b = S.settings.batches; return Array.isArray(b) && b.length ? b : DEFAULT_SETTINGS.batches; }
function isAdmin() { return S.me?.role === "admin"; }
function isStaff() { return S.me?.role === "admin" || S.me?.role === "staff"; }
function uploadsOpenNow() {
  const s = S.settings; if (!s.uploadsOpen) return false;
  const now = Date.now();
  if (s.uploadsFrom && now < new Date(s.uploadsFrom).getTime()) return false;
  if (s.uploadsUntil && now > new Date(s.uploadsUntil).getTime()) return false;
  return true;
}
function uploadsWindowText() {
  const s = S.settings;
  if (!s.uploadsOpen) return "File uploading is currently closed by the TOSCAN Office.";
  const now = Date.now();
  if (s.uploadsFrom && now < new Date(s.uploadsFrom).getTime()) return `File uploading opens on ${fmtDate(s.uploadsFrom, true)}.`;
  if (s.uploadsUntil && now > new Date(s.uploadsUntil).getTime()) return `File uploading closed on ${fmtDate(s.uploadsUntil, true)}.`;
  if (s.uploadsUntil) return `Uploading is open until ${fmtDate(s.uploadsUntil, true)}.`;
  return "Uploading is open.";
}
function allowanceId(uid, sy, sem) { return `${uid}__${sy}__${sem}`.replace(/[^A-Za-z0-9_-]/g, "_"); }
function authError(e) {
  const c = e?.code || "";
  const m = {
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/wrong-password": "Incorrect email or password.",
    "auth/user-not-found": "No account uses that email. Create an account first.",
    "auth/invalid-email": "That email address is not valid.",
    "auth/email-already-in-use": "An account with this email already exists. Sign in instead — for a Gmail address you can also use “Sign in with Google”.",
    "auth/weak-password": "Use a password of at least 6 characters.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes, then try again or reset your password.",
    "auth/network-request-failed": "No internet connection. Check your connection and try again.",
    "auth/unauthorized-domain": "This website address is not yet allowed to sign in. The Admin must add it in Firebase → Authentication → Settings → Authorized domains.",
    "auth/operation-not-allowed": "This sign-in method is not turned on yet. The Admin must enable it in Firebase → Authentication → Sign-in method.",
    "auth/account-exists-with-different-credential": "This email is already registered with a different sign-in method. Use the method you used before.",
    "auth/popup-blocked": "Your browser blocked the Google window. Allow pop-ups for this site and try again."
  };
  return m[c] || (e?.message || "Something went wrong.").replace(/^Firebase:\s*/, "");
}
function dbError(e) {
  if (e?.code === "permission-denied") return "You don't have permission to do that. If you were just approved, sign out and in again.";
  if (e?.code === "unavailable") return "Can't reach the database. Check your internet connection.";
  return (e?.message || String(e)).replace(/^Firebase:\s*/, "");
}
async function queueMail(to, subject, html) {
  if (!to) return;
  try { await addDoc(collection(db, "mail"), { to, message: { subject, html }, createdAt: serverTimestamp() }); }
  catch (e) { console.warn("Mail not queued", e); }
}
function mailWrap(name, body) {
  return `<p>Dear ${esc(name)},</p>${body}<p>You can sign in to the TOSCAN Portal at <a href="${esc(location.origin)}">${esc(location.origin)}</a>.</p><p>— TOSCAN Office, Municipality of Candoni</p>`;
}
async function resizeImage(file, max = 512) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
}

/* ===================== MODAL ===================== */
function openModal(html, onMount) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog"><button class="x" aria-label="Close">×</button>${html}</div></div>`;
  const back = $(".modal-back", root);
  $(".x", root).onclick = closeModal;
  back.addEventListener("mousedown", e => { if (e.target === back) closeModal(); });
  onMount && onMount($(".modal", root));
}
function closeModal() { $("#modal-root").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ===================== AUTH LIFECYCLE ===================== */
function stopAll() {
  [...S.baseUnsubs, ...S.roleUnsubs].forEach(u => { try { u(); } catch {} });
  S.baseUnsubs = []; S.roleUnsubs = []; S.roleKey = "";
  S.users = []; S.subs = []; S.allow = [];
}

getRedirectResult(auth).catch(e => { if (e?.code) setTimeout(() => toast(authError(e), "err"), 300); });

onAuthStateChanged(auth, user => {
  stopAll();
  closeModal();
  S.authUser = user; S.me = user ? undefined : null; S.screen = ""; S.view = "home"; S.editingPending = false;
  if (!user) { renderLogin(); return; }
  renderLoading();

  S.baseUnsubs.push(onSnapshot(doc(db, "settings", "app"), snap => {
    S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists() ? snap.data() : {}) };
    S.settings.signatories = { ...DEFAULT_SETTINGS.signatories, ...(S.settings.signatories || {}) };
    refresh();
  }, () => {}));

  S.baseUnsubs.push(onSnapshot(doc(db, "users", user.uid), async snap => {
    if (!snap.exists()) {
      if (ADMIN_EMAILS.includes((user.email || "").toLowerCase()) && user.emailVerified) {
        try {
          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid, email: user.email, emailLower: user.email.toLowerCase(),
            firstName: user.displayName || "TOSCAN Office", surname: "",
            displayName: user.displayName || "TOSCAN Office", photoURL: user.photoURL || "",
            status: "approved", role: "admin", group: "none",
            createdAt: serverTimestamp(), approvedAt: serverTimestamp(), approvedBy: "system"
          });
          return; // snapshot fires again
        } catch (e) { console.warn("Admin bootstrap failed", e); }
      }
      S.me = null; render(); return;
    }
    S.me = { id: snap.id, ...snap.data() };
    startRoleListeners();
    render();
  }, e => {
    $("#app").innerHTML = `<div class="center-wrap"><div class="auth-card"><h2>Can't load your account</h2><p class="msg err">${esc(dbError(e))}</p><button class="btn block" id="lo">Sign out</button></div></div>`;
    $("#lo").onclick = () => signOut(auth);
  }));
});

function startRoleListeners() {
  const key = `${S.me.status}|${S.me.role}`;
  if (key === S.roleKey) return;
  S.roleUnsubs.forEach(u => { try { u(); } catch {} });
  S.roleUnsubs = []; S.roleKey = key;
  S.users = []; S.subs = []; S.allow = [];
  if (S.me.status !== "approved") return;
  const uid = S.authUser.uid;
  const onErr = e => console.warn(e);
  if (isStaff()) {
    S.roleUnsubs.push(onSnapshot(collection(db, "users"), s => { S.users = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, onErr));
    S.roleUnsubs.push(onSnapshot(collection(db, "submissions"), s => { S.subs = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, onErr));
    S.roleUnsubs.push(onSnapshot(collection(db, "allowances"), s => { S.allow = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, onErr));
  } else {
    S.roleUnsubs.push(onSnapshot(query(collection(db, "submissions"), where("uid", "==", uid)), s => { S.subs = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, onErr));
    S.roleUnsubs.push(onSnapshot(query(collection(db, "allowances"), where("uid", "==", uid)), s => { S.allow = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, onErr));
  }
}

/* ===================== TOP-LEVEL RENDER ===================== */
function render() {
  if (!S.authUser) return renderLogin();
  if (S.me === undefined) return renderLoading();
  if (S.me === null || S.editingPending) return renderRegistration();
  if (S.me.status !== "approved") return renderStatus();
  renderShell();
}
function refresh() {
  if (S.screen === "shell") { updateChrome(); if (!S.dirty) renderView(); else showRefreshBar(); }
  else if (S.screen === "status") renderStatus();
}
function renderLoading() { S.screen = "loading"; $("#app").innerHTML = `<div class="loading">Loading TOSCAN Portal…</div>`; }

/* ===================== LOGIN ===================== */
const G_ICON = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;

function renderLogin(mode = "signin") {
  S.screen = "login";
  const create = mode === "create";
  $("#app").innerHTML = `
  <div class="center-wrap"><div class="auth-card">
    <div class="auth-brand"><img src="${TOSCAN_SEAL}" alt="TOSCAN seal"><h1>TOSCAN Portal</h1><p>Municipal Government of Candoni</p></div>
    <button class="gbtn" id="g-btn">${G_ICON} ${create ? "Sign up" : "Sign in"} with Google</button>
    <div class="or">or use your email</div>
    <form id="auth-form" class="grid" novalidate>
      <div><label for="em">Email address</label><input type="email" id="em" autocomplete="email" required></div>
      <div><label for="pw">Password</label><input type="password" id="pw" autocomplete="${create ? "new-password" : "current-password"}" required minlength="6"></div>
      ${create ? `<div><label for="pw2">Confirm password</label><input type="password" id="pw2" autocomplete="new-password" required></div>
      <p class="small muted" style="margin:0">At least 6 characters. After creating your account you'll fill in your details and wait for approval by the TOSCAN Office.</p>` : ""}
      <button class="btn primary block" type="submit" id="sub">${create ? "Create account" : "Sign in"}</button>
    </form>
    <div class="msg" id="amsg"></div>
    <div class="auth-links">
      ${create ? `<button class="linkbtn" id="to-signin">I already have an account</button>`
               : `<button class="linkbtn" id="to-create">Create an account</button><button class="linkbtn" id="forgot">Forgot password?</button>`}
    </div>
  </div></div>`;
  const msg = (t, ok) => { const m = $("#amsg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); };
  $("#g-btn").onclick = async () => {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
    try { await signInWithPopup(auth, p); }
    catch (e) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) {
        try { await signInWithRedirect(auth, p); } catch (e2) { msg(authError(e2)); }
      } else if (e.code !== "auth/popup-closed-by-user") msg(authError(e));
    }
  };
  $("#auth-form").onsubmit = async ev => {
    ev.preventDefault();
    const em = $("#em").value.trim(), pw = $("#pw").value;
    if (!em) return msg("Enter your email address.");
    if (pw.length < 6) return msg("Use a password of at least 6 characters.");
    const btn = $("#sub"); btn.disabled = true;
    try {
      if (create) {
        if (pw !== $("#pw2").value) { btn.disabled = false; return msg("The two passwords do not match."); }
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        sendEmailVerification(cred.user).catch(() => {});
      } else {
        await signInWithEmailAndPassword(auth, em, pw);
      }
    } catch (e) { msg(authError(e)); btn.disabled = false; }
  };
  if (create) $("#to-signin").onclick = () => renderLogin("signin");
  else {
    $("#to-create").onclick = () => renderLogin("create");
    $("#forgot").onclick = async () => {
      let em = $("#em").value.trim();
      if (!em) em = (prompt("Enter the email address of your account:") || "").trim();
      if (!em) return;
      try { await sendPasswordResetEmail(auth, em); msg(`If an account exists for ${em}, a reset link has been sent. Check your Spam folder too.`, true); }
      catch (e) { msg(authError(e)); }
    };
  }
}

/* ===================== REGISTRATION (profile completion) ===================== */
async function findLegacyRecord(email) {
  const e = (email || "").toLowerCase();
  for (const field of ["emailLower", "email"]) {
    try {
      const snap = await getDocs(query(collection(db, "students"), where(field, "==", field === "email" ? email : e)));
      if (!snap.empty) return snap.docs[0].data();
    } catch { /* not allowed or not found */ }
  }
  return null;
}

function renderRegistration() {
  if (S.screen === "register") return;   // keep what the user typed
  S.screen = "register";
  const u = S.authUser, m = S.me || {};
  const editing = !!S.me;
  $("#app").innerHTML = `
  <div class="center-wrap"><div class="auth-card wide">
    <div class="auth-brand"><img src="${TOSCAN_SEAL}" alt=""><h1>${editing ? "Update your registration" : "Complete your registration"}</h1>
      <p>Signed in as <b>${esc(u.email)}</b></p></div>
    <div class="notice info" id="legacy-note" style="display:none">We found your record from the old portal and filled in what we could. Please check every field.</div>
    <form id="reg" class="grid g2" novalidate>
      <div><label class="req">Surname</label><input type="text" name="surname" required></div>
      <div><label class="req">First name</label><input type="text" name="firstName" required></div>
      <div><label>Middle name</label><input type="text" name="middleName"></div>
      <div><label>Extension</label><select name="extName">${opts([["", "None"], ["JR.", "Jr."], ["SR.", "Sr."], ["II", "II"], ["III", "III"]], "")}</select></div>
      <div><label>TOSCAN ID number <span class="muted">(if you have one)</span></label><input type="text" name="toscanId" placeholder="e.g. TO2-201001"></div>
      <div><label class="req">Batch</label><select name="batch" required>${opts(batchList(), "", "— choose —")}</select></div>
      <div><label class="req">School</label><input type="text" name="school" required></div>
      <div><label class="req">Course / grade level</label><input type="text" name="course" required></div>
      <div><label class="req">School year</label><input type="text" name="schoolYear" placeholder="${esc(S.settings.schoolYear)}" required></div>
      <div><label class="req">Semester</label><select name="semester" required>${opts(SEMESTERS, "", "— choose —")}</select></div>
      <div><label class="req">Contact number</label><input type="tel" name="contact" required></div>
      <div><label>ATM number</label><input type="text" name="atmNumber"></div>
      <div class="span2"><label class="req">Complete mailing address</label><input type="text" name="address" required></div>
      <div class="span2 small muted">The TOSCAN Office will review your details, then set your access level and whether you belong to the Top 10 or Top 20. You'll be emailed once you're approved.</div>
      <div class="span2" style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:space-between">
        <button type="button" class="btn" id="reg-out">${editing ? "Cancel" : "Sign out"}</button>
        <button type="submit" class="btn primary" id="reg-sub">${editing ? "Save changes" : "Submit for approval"}</button>
      </div>
      <div class="span2 msg" id="rmsg"></div>
    </form>
  </div></div>`;
  const form = $("#reg");
  const fill = data => { for (const [k, v] of Object.entries(data || {})) { const el = form.elements[k]; if (el && v != null && !el.value) el.value = v; } };
  if (editing) fill(m);
  else {
    const names = (u.displayName || "").trim().split(/\s+/);
    if (names.length > 1) fill({ firstName: names.slice(0, -1).join(" "), surname: names.at(-1) });
    findLegacyRecord(u.email).then(old => {
      if (!old || S.screen !== "register") return;
      ["surname","firstName","middleName","extName","school","course","schoolYear","semester","contact","address","atmNumber","toscanId"]
        .forEach(k => { const el = form.elements[k]; if (el && old[k]) el.value = old[k]; });
      if (old.batch && form.elements.batch) {
        if (![...form.elements.batch.options].some(o => o.value === old.batch)) form.elements.batch.insertAdjacentHTML("beforeend", opt(old.batch, old.batch, old.batch));
        form.elements.batch.value = old.batch;
      }
      $("#legacy-note").style.display = "";
    });
  }
  $$("input[name=surname],input[name=firstName],input[name=middleName],input[name=school],input[name=course],input[name=address]", form)
    .forEach(el => el.addEventListener("input", () => { const p = el.selectionStart; el.value = el.value.toUpperCase(); el.setSelectionRange(p, p); }));
  $("#reg-out").onclick = () => { if (editing) { S.editingPending = false; S.screen = ""; render(); } else signOut(auth); };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(form).entries());
    for (const k in d) d[k] = String(d[k]).trim();
    const missing = [...form.querySelectorAll("[required]")].filter(el => !el.value.trim()).map(el => el.closest("div").querySelector("label").textContent.replace("*", "").trim());
    const msg = $("#rmsg");
    if (missing.length) { msg.className = "span2 msg err"; msg.textContent = "Please fill in: " + missing.join(", ") + "."; return; }
    if (!/^[\d+()\-\s]{7,}$/.test(d.contact)) { msg.className = "span2 msg err"; msg.textContent = "Enter a valid contact number."; return; }
    $("#reg-sub").disabled = true;
    try {
      if (editing) {
        await updateDoc(doc(db, "users", u.uid), { ...d, updatedAt: serverTimestamp() });
        S.editingPending = false; S.screen = ""; toast("Registration updated.", "ok"); render();
      } else {
        await setDoc(doc(db, "users", u.uid), {
          ...d, uid: u.uid, email: u.email, emailLower: (u.email || "").toLowerCase(),
          displayName: u.displayName || "", photoURL: u.photoURL || "",
          provider: u.providerData?.[0]?.providerId || "password",
          status: "pending", role: "student", group: "none",
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        const who = fullName(d);
        queueMail(S.settings.notifyEmail, `TOSCAN — New registration waiting for approval: ${who}`,
          `<p>${esc(who)} (${esc(u.email)}) registered on the TOSCAN Portal and is waiting for approval.</p><p>Open <b>Approvals</b> in the portal to review it.</p>`);
      }
    } catch (e) { msg.className = "span2 msg err"; msg.textContent = dbError(e); $("#reg-sub").disabled = false; }
  };
}

/* ===================== STATUS SCREENS (pending / declined / archived) ===================== */
function renderStatus() {
  S.screen = "status";
  const m = S.me, u = S.authUser;
  const unverified = u.providerData?.[0]?.providerId === "password" && !u.emailVerified;
  let title, body;
  if (m.status === "pending") {
    title = "Waiting for approval";
    body = `<p>Thank you, ${esc(m.firstName || "")}. Your registration was received on ${fmtDate(m.createdAt)}.</p>
      <p>The TOSCAN Office will review it, set your access level and assign you to the Top 10 or Top 20. You'll get an email when it's approved — this page also updates by itself.</p>
      ${unverified ? `<div class="notice warn">Please also confirm your email address using the link we sent to <b>${esc(u.email)}</b>. <button class="linkbtn" id="resend">Send it again</button></div>` : ""}
      <button class="btn" id="edit-reg">Edit my registration</button>`;
  } else if (m.status === "declined") {
    title = "Registration not approved";
    body = `<p>The TOSCAN Office did not approve this registration.</p>${m.adminNote ? `<div class="notice bad"><b>Reason:</b> ${esc(m.adminNote)}</div>` : ""}<p>If you think this is a mistake, contact the TOSCAN Office.</p>`;
  } else {
    title = "Account no longer active";

async function uploadSubmission(form) {
  const msg = $("#up-msg"), bar = $("#up-prog"), btn = $("#up-btn");
  const err = t => { msg.className = "msg err"; msg.textContent = t; };
  const category = form.elements.category.value, file = form.elements.file.files[0];
  if (!category) return err("Choose the type of file.");
  if (!file) return err("Choose a file to upload.");
  if (file.size > MAX_FILE_MB * 1024 * 1024) return err(`The file is ${(file.size / 1048576).toFixed(1)} MB. The limit is ${MAX_FILE_MB} MB.`);
  if (!uploadsOpenNow()) return err(uploadsWindowText());
  const uid = S.authUser.uid;
  const safe = file.name.replace(/[^\w.\- ]+/g, "_").slice(-120);
  const path = `uploads/${uid}/${Date.now()}_${safe}`;
  btn.disabled = true; bar.classList.remove("hidden"); msg.className = "msg"; msg.textContent = "Uploading…";
  S.dirty = true;
  try {
    const task = uploadBytesResumable(sRef(storage, path), file, { contentType: file.type || "application/octet-stream" });
    task.on("state_changed", s => { $("div", bar).style.width = (s.bytesTransferred / s.totalBytes * 100).toFixed(0) + "%"; });
    await task;
    const url = await getDownloadURL(task.snapshot.ref);
    await addDoc(collection(db, "submissions"), {
      uid, ownerName: fullName(S.me), toscanId: S.me.toscanId || "", email: S.me.email,
      group: S.me.group || "none", batch: S.me.batch || "",
      category, schoolYear: form.elements.schoolYear.value.trim(), semester: form.elements.semester.value,
      note: form.elements.note.value.trim(), fileName: file.name, storagePath: path, url,
      size: file.size, contentType: file.type || "", status: "Submitted", remarks: "",
      uploadedAt: serverTimestamp()
    });
    toast("File uploaded. You can follow its status below.", "ok");
    S.dirty = false; renderView();
  } catch (e) {
    err(e?.code?.startsWith?.("storage/") ? (e.code === "storage/unauthorized" ? "Upload not allowed. Your account may not be approved yet, or the file is too large." : e.message) : dbError(e));
    btn.disabled = false;
  }
}
async function removeSubmission(s) {
  if (!s || !confirm(`Remove “${s.fileName}”? You can upload a new one afterwards.`)) return;
  try {
    await deleteDoc(doc(db, "submissions", s.id));
    deleteObject(sRef(storage, s.storagePath)).catch(() => {});
    toast("File removed.", "ok");
  } catch (e) { toast(dbError(e), "err"); }
}

async function approveUser(u, role, group) {
  if (role === "student" && group === "none" && !confirm("This student has no Top 10 / Top 20 group yet. Approve anyway?")) return;

  try {
    await updateDoc(doc(db, "users", u.id), { status: "approved", role, group, adminNote: "", approvedAt: serverTimestamp(), approvedBy: fullName(S.me) });
    queueMail(u.email, "TOSCAN — Your account has been approved",
      mailWrap(u.firstName || fullName(u), `<p>Your TOSCAN Portal account has been approved with <b>${esc(ROLES[role])}</b> access${group !== "none" ? ` as <b>${esc(GROUPS[group])}</b>` : ""}.</p>`));
    toast(`${fullName(u)} approved.`, "ok");

}
async function declineUser(u) {
  const reason = prompt(`Decline ${fullName(u)}? Optionally type the reason (it is shown to them):`, "");
  if (reason === null) return;
  try {
    await updateDoc(doc(db, "users", u.id), { status: "declined", adminNote: reason.trim(), approvedBy: fullName(S.me) });
    queueMail(u.email, "TOSCAN — Registration not approved",
      mailWrap(u.firstName || fullName(u), `<p>Your TOSCAN Portal registration was not approved.</p>${reason.trim() ? `<p>Reason: ${esc(reason.trim())}</p>` : ""}`));
    toast("Registration declined.");
  } catch (e) { toast(dbError(e), "err"); }
}

async function reviewSubmission(s, status, remarks) {
  if (status === "Returned" && !remarks) return toast("Add a remark telling the student what to fix.", "err");
  try {
    await updateDoc(doc(db, "submissions", s.id), { status, remarks, reviewedAt: serverTimestamp(), reviewedBy: fullName(S.me) });

      queueMail(s.email, `TOSCAN — Your file is now “${status}”: ${s.category}`,
        mailWrap(s.ownerName, `<p>Your file <b>${esc(s.fileName)}</b> (${esc(s.category)}) is now <b>${esc(status)}</b>.</p>${remarks ? `<p>Remarks: ${esc(remarks)}</p>` : ""}${status === "Returned" ? "<p>Please fix the file and upload it again from your dashboard.</p>" : ""}`));
    }
    S.dirty = false; toast("Status saved.", "ok");
  } catch (e) { toast(dbError(e), "err"); }
}

async function savePayroll(sy, sem) {
  if (!sy) return toast("Enter the school year.", "err");
  const batch = writeBatch(db); let n = 0;
  const changes = [];
  for (const tr of $$("#pt tr[data-uid]")) {
    const u = S.users.find(x => x.id === tr.dataset.uid);
    const id = allowanceId(u.id, sy, sem);
    const existing = S.allow.find(a => a.id === id);
    const raw = $(".p-amt", tr).value.trim(), status = $(".p-st", tr).value, releasedAt = $(".p-dt", tr).value, remarks = $(".p-rm", tr).value.trim();
    if (!raw && !existing) continue;
    if (!raw && existing) { batch.delete(doc(db, "allowances", id)); n++; continue; }
    const amount = Math.round(Number(raw) * 100) / 100;
    if (!(amount >= 0)) return toast(`Invalid amount for ${fullName(u)}.`, "err");
    if (existing && existing.amount === amount && existing.status === status && (existing.releasedAt || "") === releasedAt && (existing.remarks || "") === remarks) continue;
    batch.set(doc(db, "allowances", id), {
      uid: u.id, ownerName: fullName(u), toscanId: u.toscanId || "", email: u.email || "", group: u.group || "none",
      batch: u.batch || "", atmNumber: u.atmNumber || "", schoolYear: sy, semester: sem,
      amount, status, releasedAt: status === "Released" ? (releasedAt || new Date().toISOString().slice(0, 10)) : "",
      remarks, updatedAt: serverTimestamp(), updatedBy: fullName(S.me)
    }, { merge: true });
    if (status === "Released" && existing?.status !== "Released") changes.push({ u, amount });
    n++;
  }
  const sig = { a: $("#sa").value.trim(), b: $("#sb").value.trim(), c: $("#sc").value.trim(), d: $("#sd").value.trim() };
  const sigChanged = JSON.stringify(sig) !== JSON.stringify(S.settings.signatories);
  if (sigChanged) batch.set(doc(db, "settings", "app"), { signatories: sig }, { merge: true });
  if (!n && !sigChanged) return toast("Nothing to save.");
  try {
    await batch.commit();
    changes.forEach(({ u, amount }) => queueMail(u.email, `TOSCAN — Allowance released (${sem}, SY ${sy})`,
      mailWrap(u.firstName || fullName(u), `<p>Your TOSCAN allowance of <b>${money(amount)}</b> for ${esc(sem)}, SY ${esc(sy)} has been released.</p>`)));
    S.dirty = false; toast(`Saved ${n} record${n === 1 ? "" : "s"}.`, "ok"); renderView();
  } catch (e) { toast(dbError(e), "err"); }
}

function exportCsv() {
  const { sy, sem, rows } = payrollRows();
  const list = rows.filter(r => r.a);
  if (!list.length) return toast("No saved amounts to export.", "err");
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [["ATM Number", "Complete Name", "TOSCAN ID", "Batch", "Amount", "Status", "Date Released"].map(q).join(",")]
    .concat(list.map(r => [r.u.atmNumber, fullName(r.u), r.u.toscanId, r.u.batch, plainMoney(r.a.amount), r.a.status, r.a.releasedAt].map(q).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `toscan_payroll_${S.f.pay.group}_${sy}_${sem}.csv`.replace(/\s+/g, "_");
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ===================== ADMIN: SETTINGS ===================== */
function viewSettings(main) {
  const s = S.settings;
  main.innerHTML = `
    <h2>Settings</h2>
    <div class="card"><div class="card-head"><h3>Current term</h3></div>
      <p class="small muted" style="margin-top:-.4rem">Used as the default on upload forms and on the Allowance & Payroll screen.</p>
      <div class="grid g3">
        <div><label>School year</label><input type="text" id="s-sy" value="${esc(s.schoolYear)}" placeholder="2025-2026"></div>
        <div><label>Semester</label><select id="s-sem">${opts(SEMESTERS, s.semester)}</select></div>
      </div></div>
    <div class="card"><div class="card-head"><h3>File uploading</h3><span class="small muted">${esc(uploadsWindowText())}</span></div>
      <div class="grid g3">
        <div><label><input type="checkbox" id="s-open" ${s.uploadsOpen ? "checked" : ""}> Uploading is open</label><div class="small muted">Untick to close uploading for everyone.</div></div>
        <div><label>Opens (optional)</label><input type="datetime-local" id="s-from" value="${esc(s.uploadsFrom || "")}"></div>
        <div><label>Closes (optional)</label><input type="datetime-local" id="s-until" value="${esc(s.uploadsUntil || "")}"></div>
      </div></div>
    <div class="card"><div class="card-head"><h3>Batches</h3></div>
      <div id="s-batches" class="chips" style="margin-bottom:.7rem">${batchList().map((b, i) => `<span class="badge b-gold" style="font-size:.85rem">${esc(b)} <button class="linkbtn" data-rm="${i}" title="Remove" style="color:#6d5512;text-decoration:none">×</button></span>`).join("")}</div>
      <div style="display:flex;gap:.5rem;max-width:420px"><input type="text" id="s-newb" placeholder="e.g. Batch 8"><button class="btn" id="s-addb">Add</button></div></div>
    <div class="card"><div class="card-head"><h3>Notifications</h3></div>
      <div class="grid g2"><div><label>Office email (new registrations are announced here)</label><input type="email" id="s-mail" value="${esc(s.notifyEmail || "")}"></div></div>
      <p class="small muted">Emails are sent only if the “Trigger Email from Firestore” extension is installed in Firebase (collection: <code>mail</code>).</p></div>
    <div class="right"><button class="btn primary" id="s-save">Save settings</button></div>`;
  let batches = [...batchList()];
  const drawB = () => {
    $("#s-batches").innerHTML = batches.map((b, i) => `<span class="badge b-gold" style="font-size:.85rem">${esc(b)} <button class="linkbtn" data-rm="${i}" style="color:#6d5512;text-decoration:none">×</button></span>`).join("");
    $$("[data-rm]", main).forEach(x => x.onclick = () => {
      const b = batches[+x.dataset.rm];
      if (S.users.some(u => u.batch === b) && !confirm(`${b} is used by existing students. Remove it from the list anyway? (Their records keep it.)`)) return;
      batches.splice(+x.dataset.rm, 1); S.dirty = true; drawB();
    });
  };
  drawB();
  $("#s-addb").onclick = () => { const v = $("#s-newb").value.trim(); if (!v) return; if (batches.includes(v)) return toast("That batch already exists.", "err"); batches.push(v); $("#s-newb").value = ""; S.dirty = true; drawB(); };
  $("#s-save").onclick = async () => {
    const sy = $("#s-sy").value.trim(); if (!/^\d{4}-\d{4}$/.test(sy)) return toast("School year must look like 2025-2026.", "err");
    const mail = $("#s-mail").value.trim(); if (mail && !/^\S+@\S+\.\S+$/.test(mail)) return toast("Enter a valid office email.", "err");
    const from = $("#s-from").value, until = $("#s-until").value;
    if (from && until && new Date(from) >= new Date(until)) return toast("The closing time must be after the opening time.", "err");
    try {
      await setDoc(doc(db, "settings", "app"), {
        schoolYear: sy, semester: $("#s-sem").value, uploadsOpen: $("#s-open").checked, uploadsFrom: from, uploadsUntil: until,
        batches, notifyEmail: mail, updatedAt: serverTimestamp(), updatedBy: fullName(S.me)
      }, { merge: true });
      S.dirty = false; toast("Settings saved.", "ok");
    } catch (e) { toast(dbError(e), "err"); }
  };
}
</script>
</body>
</html>
